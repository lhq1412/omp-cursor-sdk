name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, 0.4.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Ref $GITHUB_REF is not default branch $DEFAULT_BRANCH"
            exit 1
          fi
          VERSION="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --ignore-scripts -m "release: v%s"
          git push origin "HEAD:$DEFAULT_BRANCH" --follow-tags
          tarball="$(npm pack --ignore-scripts)"
          gh release create "v$VERSION" "$tarball" --verify-tag --title "v$VERSION" --generate-notes
