name: finalize-v0.4.1-metadata

on:
  push:
    branches:
      - release/v0.4.1
    paths:
      - .github/workflows/finalize-v0.4.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.4.1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - name: Sync package-lock release version
        run: npm install --package-lock-only --ignore-scripts
      - name: Split v0.4.1 changelog entries
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const header = '# Changelog\n\n';
          if (!text.startsWith(header)) throw new Error('Unexpected CHANGELOG header');
          if (text.includes('## 0.4.1 - 2026-08-31')) throw new Error('0.4.1 section already exists');

          const entries = [
            '- Baseline whole-agent local billed-usage UUIDs before each local SDKAgent handle\'s first send in a process, so resumed agents do not charge the historical turns reported by that baseline to the current OMP message; failed baselines suppress billed spend for that turn and retry safely before the next send.',
            '- Synchronize `bun.lock` with the pinned Cursor SDK/OMP 18 dependency family, enforce direct-spec lock alignment in tests, and run frozen install, full typecheck, unit/platform contracts, and package-readiness checks in CI.',
          ];

          for (const entry of entries) {
            const occurrences = text.split(entry).length - 1;
            if (occurrences !== 1) throw new Error(`Expected one changelog entry, found ${occurrences}: ${entry}`);
            text = text.replace(`${entry}\n`, '');
          }

          const section = `## 0.4.1 - 2026-08-31\n\n### Fixed\n\n${entries.join('\n')}\n\n`;
          text = header + section + text.slice(header.length);
          fs.writeFileSync(path, text);
          NODE
      - name: Verify release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '0.4.1') throw new Error(`package.json version is ${pkg.version}`);
          if (lock.version !== '0.4.1') throw new Error(`package-lock root version is ${lock.version}`);
          if (lock.packages?.['']?.version !== '0.4.1') throw new Error(`package-lock package version is ${lock.packages?.['']?.version}`);
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.startsWith('# Changelog\n\n## 0.4.1 - 2026-08-31\n')) throw new Error('0.4.1 changelog section is not first');
          NODE
          git diff --check
      - name: Commit generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json CHANGELOG.md
          git diff --cached --quiet && { echo 'No metadata changes to commit'; exit 1; }
          git commit -m 'chore(release): finalize v0.4.1 metadata'
          git push origin HEAD:release/v0.4.1
