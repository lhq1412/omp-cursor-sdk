name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies from frozen Bun lockfile
        run: bun ci
      - name: Typecheck source, tests, and replay contracts
        run: bun run typecheck
      - name: Unit and contract tests (Bun runtime)
        run: bun run test
      - name: Validate platform smoke tooling
        run: bun run check:platform-smoke
      - name: Verify npm package contents
        run: npm pack --dry-run
